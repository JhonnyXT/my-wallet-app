name: EAS Build (Android)

on:
  workflow_dispatch: # solo se lanza manualmente desde GitHub Actions
    inputs:
      profile:
        description: "Perfil de eas.json: prod (AAB para Play) o prod-apk (APK para GitHub)"
        type: choice
        options: [prod, prod-apk]
        default: prod

jobs:
  build:
    name: EAS Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Android (${{ inputs.profile }})
        # La CLI resuelve app.config.ts aquí: sin APP_VARIANT tomaría dev (applicationId equivocado).
        env:
          APP_VARIANT: prod
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive
